services:
  - type: web
    name: randomtripgenerator
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_API_BASE_URL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      # Umami analytics (cookieless). Read by Vite at BUILD time, so it must be
      # present during `npm run build`. Paste the website id from cloud.umami.is
      # in the Render dashboard; leave VITE_UMAMI_SRC unset unless self-hosting.
      - key: VITE_UMAMI_WEBSITE_ID
        sync: false
