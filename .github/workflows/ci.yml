name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the app declares (engines.node) and the version used locally.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install server dependencies
        run: npm ci

      # No DATABASE_URL and no API keys on purpose: the tests cover pure logic,
      # and requiring server.js has to stay side-effect-free for that to hold. If
      # someone adds a module-level connection, this job is where it shows up.
      - name: Run tests
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Check the built index.html still carries the SEO anchors
        # The server injects per-page metadata and content by rewriting these.
        # Losing one is silent: the city pages would go back to serving the
        # homepage's title and body, which is exactly what happened once.
        run: |
          for pattern in 'id="root"' 'id="seo-content"' 'id="seo-prerender"' 'rel="canonical"' 'property="og:title"' 'name="twitter:title"'; do
            if ! grep -q "$pattern" client/dist/index.html; then
              echo "::error::client/dist/index.html no contiene $pattern"
              exit 1
            fi
          done
          echo "todos los anclajes presentes"
